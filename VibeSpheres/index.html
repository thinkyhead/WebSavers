<!DOCTYPE html>
<!-- Authored with gpt-oss-20b running as a helpful AI assistant -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk Spheres</title>
  <style>body{margin:0; overflow:hidden; background:#000}</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

let scene, camera, renderer, spheres, stars;
let sphereCount = 200;
let starCount  = 3000;
let cameraSpeed = 0.05;
let colorCycle = 0.5;

init();
animate();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0,0,50);
  scene.add(camera);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  const ambient = new THREE.AmbientLight(0x222222);
  scene.add(ambient);

  buildSpheres();
  buildStars();

  window.addEventListener('resize', onResize, false);
}

function buildSpheres() {
  if (spheres) scene.remove(spheres);
  const geo = new THREE.SphereGeometry(1.5, 32, 32);
  const mat = new THREE.MeshStandardMaterial({
    metalness: 0.3, roughness: 0.4, color: 0xFFFFFF,
    emissive: 0x000000, emissiveIntensity: 1,
    flatShading: false, blending: THREE.AdditiveBlending, transparent: true
  });

  spheres = new THREE.Group();
  for (let i = 0; i < sphereCount; i++) {
    const m = new THREE.Mesh(geo, mat.clone());
    m.position.set(
      THREE.MathUtils.randFloatSpread(50),
      THREE.MathUtils.randFloatSpread(50),
      THREE.MathUtils.randFloatSpread(50)
    );
    const s = THREE.MathUtils.randFloat(0.8, 1.5);
    m.scale.set(s,s,s);
    m.userData.baseScale = s;
    spheres.add(m);
  }
  scene.add(spheres);
}

function buildStars() {
  if (stars) scene.remove(stars);
  const starGeo = new THREE.BufferGeometry();
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPositions[i*3]   = THREE.MathUtils.randFloatSpread(200);
    starPositions[i*3+1] = THREE.MathUtils.randFloatSpread(200);
    starPositions[i*3+2] = THREE.MathUtils.randFloatSpread(200);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions,3));
  const starMat = new THREE.PointsMaterial({
    color: 0xeeeeee, size: 0.4, sizeAttenuation: true, transparent:true, opacity:0.8
  });
  stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
}

function onResize() {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const t = performance.now() * 0.001;

  const radius = 50;
  camera.position.x = Math.cos(t * cameraSpeed) * radius;
  camera.position.z = Math.sin(t * cameraSpeed) * radius;
  camera.lookAt(0,0,0);

  spheres.children.forEach((mesh,i)=>{
    const axis = new THREE.Vector3(
      Math.sin(i+t*0.1), Math.cos(i+t*0.2), Math.sin(i*0.3)
    ).normalize();
    mesh.rotateOnAxis(axis, 0.01);

    const pulse = 0.2 * Math.sin(t*2 + i);
    const s = mesh.userData.baseScale + pulse;
    mesh.scale.set(s,s,s);

    const hue = 0.6 + 0.4 * Math.sin(t * colorCycle + i);
    const saturation = 0.8;
    const value = 0.8 + 0.2 * Math.sin(t*0.3 + i);
    const colour = new THREE.Color().setHSL(hue, saturation, value);
    mesh.material.color.copy(colour);
    mesh.material.emissive.copy(colour);
  });

  stars.material.opacity = 0.8 + 0.1 * Math.sin(t*0.3);
  renderer.render(scene, camera);
}

window.applySettings = function(settings) {
  if (settings.sphereCount !== undefined) {
    sphereCount = Math.max(50, Math.min(500, settings.sphereCount | 0));
    buildSpheres();
  }
  if (settings.starCount !== undefined) {
    starCount = Math.max(500, Math.min(8000, settings.starCount | 0));
    buildStars();
  }
  if (settings.speed !== undefined) {
    cameraSpeed = (settings.speed / 10) * 0.1;
  }
  if (settings.colorCycle !== undefined) {
    colorCycle = (settings.colorCycle / 10) * 2;
  }
};
</script>
</body>
</html>
