<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P5Alert</title>
<style>
/* P5Alert — p5.js flow field with one-time alert overlay */

* { box-sizing: border-box; margin: 0; padding: 0; }
body { overflow: hidden; background: #05050a; font-family: 'SF Mono', 'Menlo', monospace; }

#p5-canvas { position: absolute; inset: 0; z-index: 1; }

/* Alert overlay */
#alert-overlay {
  position: absolute; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  transition: opacity 0.8s ease;
}
#alert-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.alert-card {
  background: rgba(15, 25, 50, 0.88);
  border: 1px solid rgba(100, 180, 255, 0.25);
  border-radius: 14px;
  padding: 26px 34px;
  max-width: 400px;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(80, 140, 255, 0.08);
  animation: alert-appear 0.5s ease;
}

@keyframes alert-appear {
  0% { transform: scale(0.92); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.alert-title {
  font-size: 15px;
  font-weight: 600;
  color: #7ab8ff;
  margin-bottom: 8px;
  letter-spacing: 0.4px;
}

.alert-message {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.65);
  line-height: 1.5;
  margin-bottom: 16px;
}

.alert-dismiss {
  background: rgba(80, 140, 255, 0.12);
  border: 1px solid rgba(100, 180, 255, 0.25);
  border-radius: 6px;
  color: #7ab8ff;
  padding: 6px 18px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.2s;
  font-family: inherit;
}
.alert-dismiss:hover {
  background: rgba(80, 140, 255, 0.22);
}
</style>
</head>
<body>
  <div id="alert-overlay">
    <div class="alert-card">
      <div class="alert-title">Welcome to P5Alert</div>
      <div class="alert-message">
        A p5.js flow-field screensaver. Particles drift along Perlin noise
        trails, painting luminous ribbons across a dark canvas.
      </div>
      <button class="alert-dismiss" id="alert-dismiss">Got it</button>
    </div>
  </div>

  <script src="p5.min.js"></script>
  <script src="p5alert.js"></script>
</body>
</html>
