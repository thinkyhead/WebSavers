<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="utf-8">
  <title>A Torus Amorus</title>
  <style>
    body{ margin: 0; overflow: hidden; background: #111; }
  </style>
  </head>
  <body>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
        "OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/controls/OrbitControls.js"
      }
    }
    </script>
    <script>
      // Bridge: define applySettings synchronously (the module below is deferred
      // and imports THREE from CDN, so it may not be ready when the host injects
      // settings in didFinishNavigation). Buffer incoming settings and replay
      // them once the module installs its real handler.
      window.__pendingSettings = null;
      window.__applySettings = null;
      window.applySettings = function(settings) {
        if (window.__applySettings) {
          window.__applySettings(settings);
        } else {
          window.__pendingSettings = settings;
        }
      };
    </script>
    <script type="module">

      import * as THREE from 'three';
      import { OrbitControls } from 'OrbitControls';

      const scene = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      cam.position.z = 5;
      const renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Torus knot geometry - (p, q) winding numbers define the shape
      // Different pairs produce wildly different topologies
      const knotShapes = [
        [2, 3], [3, 5], [5, 7], [2, 5], [3, 4], [4, 7], [2, 7], [5, 9], [3, 7]
      ];
      let currentShapeIndex = 0;
      let morphTimer = 0, morphInterval = 8;

      let torus = new THREE.TorusKnotGeometry(1.2, 0.4, 200, 32, 2, 3);
      const mat = new THREE.MeshBasicMaterial({ color:0xFFFFFF, wireframe:true });
      const knot = new THREE.Mesh(torus, mat);
      scene.add(knot);

      // Particle system
      let particleCount = 5000;
      let positions, sizes;
      let pcGeometry, pcMaterial, particles;

      function buildParticles() {
        positions = new Float32Array(particleCount * 3);
        sizes = new Float32Array(particleCount);
        const tau = Math.PI * 2;
        for (let i = 0; i < particleCount; i++) {
          const a = Math.random() * tau;
          const r = (0.5 + Math.random() * 2);
          positions[i * 3]     = r * Math.cos(a);
          positions[i * 3 + 1] = r * Math.sin(a);
          positions[i * 3 + 2] = (Math.random() - 0.5) * 4;
          sizes[i] = Math.random() * 5 + 2;
        }
        pcGeometry = new THREE.BufferGeometry();
        pcGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        pcGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        pcMaterial = new THREE.ShaderMaterial({
          uniforms: { color: { value: new THREE.Color(0xFF8800) } },
          vertexShader:`
            attribute float size;
            void main() { gl_PointSize = size; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
          `,
          fragmentShader:`
            uniform vec3 color;
            void main() { gl_FragColor = vec4(color,0.7); }
          `,
          transparent:true
        });

        particles = new THREE.Points(pcGeometry, pcMaterial);
        scene.add(particles);
      }
      buildParticles();

      // Animation loop
      let kspeedx = (Math.random() * 0.0005 + 0.0005) * (Math.random() < 0.5 ? -1 : 1);
      let kspeedy = (Math.random() * 0.0010 + 0.0010) * (Math.random() < 0.5 ? -1 : 1);
      let pspeedy = (Math.random() * 0.0008 + 0.0008) * (Math.random() < 0.5 ? -1 : 1);
      let t = 0;

      // Gradual morph state — all torus knots share the same tubular/radial
      // segments (200, 32), so they have identical vertex counts and topology.
      // We interpolate vertex positions from the current shape to the next.
      let morphActive = false, morphProgress = 0;
      const morphDuration = 2.0; // seconds
      let morphFrom = null, morphTo = null;

      function beginMorph(p, q) {
        // Capture the current interpolated vertex positions as the source
        morphFrom = Float32Array.from(knot.geometry.attributes.position.array);
        // Build the target shape and grab its rest positions
        const target = new THREE.TorusKnotGeometry(1.2, 0.4, 200, 32, p, q);
        morphTo = Float32Array.from(target.attributes.position.array);
        target.dispose();
        morphProgress = 0;
        morphActive = true;
      }

      function animate() {
        t += 0.001;

        // Morph the knot shape at real-time intervals (frame-rate independent)
        const now = performance.now();
        if (!animate.lastTime) animate.lastTime = now;
        const dt = (now - animate.lastTime) / 1000;   // seconds since last frame
        animate.lastTime = now;
        morphTimer += dt;
        if (morphTimer >= morphInterval) {
          morphTimer = 0;
          currentShapeIndex = (currentShapeIndex + 1) % knotShapes.length;
          const [p, q] = knotShapes[currentShapeIndex];
          beginMorph(p, q);
        }

        // Advance the gradual vertex morph
        if (morphActive) {
          morphProgress = Math.min(1, morphProgress + dt / morphDuration);
          // Ease in/out for a smooth transition
          const e = morphProgress < 0.5
            ? 2 * morphProgress * morphProgress
            : 1 - Math.pow(-2 * morphProgress + 2, 2) / 2;
          const pos = knot.geometry.attributes.position.array;
          for (let i = 0; i < pos.length; i++) {
            pos[i] = morphFrom[i] + (morphTo[i] - morphFrom[i]) * e;
          }
          knot.geometry.attributes.position.needsUpdate = true;
          knot.geometry.computeVertexNormals();
          if (morphProgress >= 1) morphActive = false;
        }

        knot.rotation.x += kspeedx;
        knot.rotation.y += kspeedy;
        particles.rotation.y += pspeedy;
        pcMaterial.uniforms.color.value.setHSL((t % 1), 0.7, 0.5);
        renderer.render(scene, cam);
        requestAnimationFrame(animate);
      }
      animate();

      // Apply settings from the config sheet. The module is deferred, so the
      // host may have injected settings into the sync bridge before this ran —
      // install our handler, then replay anything that was buffered.
      const realApplySettings = function(settings) {
        if (settings.shapeIndex !== undefined) {
          const targetIndex = settings.shapeIndex | 0;
          if (targetIndex !== currentShapeIndex) {
            currentShapeIndex = targetIndex;
            const [p, q] = knotShapes[currentShapeIndex % knotShapes.length];
            beginMorph(p, q);
          }
        }
        if (settings.particles !== undefined) {
          particleCount = Math.max(1000, Math.min(10000, settings.particles | 0));
          scene.remove(particles);
          buildParticles();
        }
        if (settings.speed !== undefined) {
          // Speed slider is 1-20 (default 10). Map it to the original
          // per-frame rotation deltas (~0.0001 to ~0.002).
          const s = (settings.speed / 10) * 0.001;
          kspeedx = kspeedx < 0 ? -s : s;
          kspeedy = kspeedy < 0 ? -s*2 : s*2;
          pspeedy = pspeedy < 0 ? -s*1.5 : s*1.5;
        }
        if (settings.morphInterval !== undefined) {
          morphInterval = Math.max(2, Math.min(20, settings.morphInterval | 0));
        }
      };
      window.__applySettings = realApplySettings;
      window.applySettings = realApplySettings;
      if (window.__pendingSettings) {
        const pending = window.__pendingSettings;
        window.__pendingSettings = null;
        realApplySettings(pending);
      }
    </script>
  </body>
</html>
