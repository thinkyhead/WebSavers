<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="utf-8">
  <title>A Torus Amorus</title>
  <style>
    body{ margin: 0; overflow: hidden; background: #111; }
  </style>
  </head>
  <body>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
        "OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/controls/OrbitControls.js"
      }
    }
    </script>
    <script type="module">

      import * as THREE from 'three';
      import { OrbitControls } from 'OrbitControls';

      const scene = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      cam.position.z = 5;
      const renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Torus knot geometry - (p, q) winding numbers define the shape
      // Different pairs produce wildly different topologies
      const knotShapes = [
        [2, 3], [3, 5], [5, 7], [2, 5], [3, 4], [4, 7], [2, 7], [5, 9], [3, 7]
      ];
      let currentShapeIndex = 0;
      let morphTimer = 0, morphInterval = 8;

      let torus = new THREE.TorusKnotGeometry(1.2, 0.4, 200, 32, 2, 3);
      const mat = new THREE.MeshBasicMaterial({ color:0xFFFFFF, wireframe:true });
      const knot = new THREE.Mesh(torus, mat);
      scene.add(knot);

      // Particle system
      let particleCount = 5000;
      let positions, sizes;
      let pcGeometry, pcMaterial, particles;

      function buildParticles() {
        positions = new Float32Array(particleCount * 3);
        sizes = new Float32Array(particleCount);
        const tau = Math.PI * 2;
        for (let i = 0; i < particleCount; i++) {
          const a = Math.random() * tau;
          const r = (0.5 + Math.random() * 2);
          positions[i * 3]     = r * Math.cos(a);
          positions[i * 3 + 1] = r * Math.sin(a);
          positions[i * 3 + 2] = (Math.random() - 0.5) * 4;
          sizes[i] = Math.random() * 5 + 2;
        }
        pcGeometry = new THREE.BufferGeometry();
        pcGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        pcGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        pcMaterial = new THREE.ShaderMaterial({
          uniforms: { color: { value: new THREE.Color(0xFF8800) } },
          vertexShader:`
            attribute float size;
            void main() { gl_PointSize = size; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
          `,
          fragmentShader:`
            uniform vec3 color;
            void main() { gl_FragColor = vec4(color,0.7); }
          `,
          transparent:true
        });

        particles = new THREE.Points(pcGeometry, pcMaterial);
        scene.add(particles);
      }
      buildParticles();

      // Animation loop
      let kspeedx = (Math.random() * 0.0005 + 0.0005) * (Math.random() < 0.5 ? -1 : 1);
      let kspeedy = (Math.random() * 0.0010 + 0.0010) * (Math.random() < 0.5 ? -1 : 1);
      let pspeedy = (Math.random() * 0.0008 + 0.0008) * (Math.random() < 0.5 ? -1 : 1);
      let t = 0;

      function setShape(p, q) {
        const old = torus;
        torus = new THREE.TorusKnotGeometry(1.2, 0.4, 200, 32, p, q);
        knot.geometry = torus;
        if (old) old.dispose();
      }

      function animate() {
        t += 0.001;

        // Morph the knot shape at intervals
        morphTimer += 0.001 * 60;
        if (morphTimer >= morphInterval) {
          morphTimer = 0;
          currentShapeIndex = (currentShapeIndex + 1) % knotShapes.length;
          const [p, q] = knotShapes[currentShapeIndex];
          setShape(p, q);
        }

        knot.rotation.x += kspeedx;
        knot.rotation.y += kspeedy;
        particles.rotation.y += pspeedy;
        pcMaterial.uniforms.color.value.setHSL((t % 1), 0.7, 0.5);
        renderer.render(scene, cam);
        requestAnimationFrame(animate);
      }
      animate();

      // Apply settings from the config sheet
      window.applySettings = function(settings) {
        if (settings.shapeIndex !== undefined) {
          currentShapeIndex = settings.shapeIndex | 0;
          const [p, q] = knotShapes[currentShapeIndex % knotShapes.length];
          setShape(p, q);
        }
        if (settings.particles !== undefined) {
          particleCount = Math.max(1000, Math.min(10000, settings.particles | 0));
          scene.remove(particles);
          buildParticles();
        }
        if (settings.speed !== undefined) {
          const s = settings.speed / 10;
          kspeedx = kspeedx < 0 ? -s : s;
          kspeedy = kspeedy < 0 ? -s*2 : s*2;
          pspeedy = pspeedy < 0 ? -s*1.5 : s*1.5;
        }
        if (settings.morphInterval !== undefined) {
          morphInterval = Math.max(2, Math.min(20, settings.morphInterval | 0));
        }
      };

    </script>
  </body>
</html>
