<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HermesBoard</title>
<link rel="stylesheet" href="hermesboard.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-grid"></div>

  <div id="dashboard">
    <div class="clock-panel" id="clock-panel">
      <div class="clock-time" id="clock-time">--:--:--</div>
      <div class="clock-date" id="clock-date">Loading...</div>
    </div>

    <div class="main-grid">
      <!-- Column 1: Gauges -->
      <div class="gauges-col" id="gauges-col">
        <div class="empty-state">Waiting for data...</div>
      </div>

      <!-- Column 2: Messages -->
      <div class="msg-col">
        <div class="col-title">Messages</div>
        <div class="col-body" id="messages-body">
          <div class="empty-state">No messages</div>
        </div>
      </div>

      <!-- Column 3: Alerts -->
      <div class="alert-col">
        <div class="col-title">Alerts</div>
        <div class="col-body" id="alerts-body">
          <div class="empty-state">No alerts</div>
        </div>
      </div>
    </div>

    <div class="image-panel" id="image-panel">
      <img id="board-image" src="" alt="">
    </div>

    <div id="status-bar">
      <div><span class="status-dot" id="status-dot"></span><span id="status-text">Waiting...</span></div>
      <div id="last-update">--</div>
    </div>
  </div>

<!-- canvas-gauges (vendored) -->
<script src="gauge.min.js"></script>
<!-- THREE.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<!-- HermesBoard logic -->
<script src="hermesboard.js"></script>
</body>
</html>
