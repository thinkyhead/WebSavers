<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HermesBoard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    overflow: hidden; background: #05050a;
    font-family: 'SF Mono', 'Menlo', monospace; color: #a0a0a0;
  }

  /* THREE.js background */
  #bg-canvas { position: fixed; inset: 0; z-index: 0; opacity: 0.4; }
  .bg-grid {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,255,100,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,100,0.015) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  #dashboard {
    position: relative; z-index: 2;
    width: 100%; height: 100vh;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }

  /* Clock */
  .clock-panel { text-align: center; padding: 6px; }
  .clock-time {
    font-size: 36px; font-weight: 200; letter-spacing: 2px; color: #fff;
    text-shadow: 0 0 20px rgba(0,255,100,0.2);
    font-variant-numeric: tabular-nums;
  }
  .clock-date { font-size: 11px; color: rgba(0,255,100,0.3); letter-spacing: 2px; }
  .clock-panel.bottom .clock-time { font-size: 22px; }
  .clock-panel.bottom .clock-date { font-size: 9px; }
  .clock-panel.hidden { display: none; }

  /* Stats panel */
  .stats-panel {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stats-panel::-webkit-scrollbar { width: 3px; }
  .stats-panel::-webkit-scrollbar-thumb { background: rgba(0,255,100,0.15); }

  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 8px;
    background: rgba(10, 15, 12, 0.5);
    border: 1px solid rgba(0,255,100,0.05);
    border-radius: 4px;
    transition: background 0.3s;
  }
  .stat-row.alert-warn { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.2); }
  .stat-row.alert-error { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.2); }
  .stat-row.alert-success { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.2); }

  .stat-label { font-size: 12px; color: rgba(255,255,255,0.4); }
  .stat-value { font-size: 13px; color: #0f0; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Messages panel */
  .messages-panel {
    max-height: 90px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px 8px;
    background: rgba(10, 15, 12, 0.4);
    border: 1px solid rgba(0,255,100,0.05);
    border-radius: 4px;
  }
  .messages-panel::-webkit-scrollbar { width: 3px; }
  .messages-panel::-webkit-scrollbar-thumb { background: rgba(0,255,100,0.15); }

  .message {
    font-size: 11px; line-height: 1.3;
    padding: 2px 0; border-bottom: 1px solid rgba(0,255,100,0.04);
  }
  .message:last-child { border-bottom: none; }
  .message .from { color: rgba(0,255,100,0.7); font-weight: 600; margin-right: 4px; }
  .message .time { color: rgba(255,255,255,0.2); float: right; font-size: 9px; }

  /* Alerts panel */
  .alerts-panel {
    max-height: 60px; overflow-y: auto;
    display: flex; gap: 4px; flex-wrap: wrap;
    padding: 4px 6px;
    background: rgba(10, 15, 12, 0.4);
    border: 1px solid rgba(0,255,100,0.05);
    border-radius: 4px;
  }
  .alert {
    font-size: 9px; padding: 2px 6px; border-radius: 3px;
    border-left: 2px solid; white-space: nowrap;
  }
  .alert.info { border-color: #3b82f6; background: rgba(59,130,246,0.06); }
  .alert.warn { border-color: #f59e0b; background: rgba(245,158,11,0.06); }
  .alert.error { border-color: #ef4444; background: rgba(239,68,68,0.06); }
  .alert.success { border-color: #10b981; background: rgba(16,185,129,0.06); }

  /* Image panel */
  .image-panel {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 15, 12, 0.4);
    border: 1px solid rgba(0,255,100,0.05);
    border-radius: 4px; padding: 8px;
    min-height: 80px;
  }
  .image-panel img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .image-placeholder { color: rgba(255,255,255,0.15); font-size: 10px; }

  /* Status bar */
  #status-bar {
    display: flex; justify-content: space-between;
    padding: 4px 6px; font-size: 9px; color: rgba(255,255,255,0.25);
    border-top: 1px solid rgba(0,255,100,0.06);
  }
  .status-dot {
    display: inline-block; width: 4px; height: 4px; border-radius: 50%;
    background: #0f0; box-shadow: 0 0 3px #0f0; margin-right: 4px; vertical-align: middle;
  }
  .status-offline { background: #f00; box-shadow: 0 0 3px #f00; }

  .empty-state { color: rgba(255,255,255,0.15); font-size: 11px; text-align: center; padding: 20px; }
</style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-grid"></div>

  <div id="dashboard">
    <div class="clock-panel" id="clock-panel">
      <div class="clock-time" id="clock-time">--:--:--</div>
      <div class="clock-date" id="clock-date">Loading...</div>
    </div>

    <div class="stats-panel" id="stats-panel">
      <div class="empty-state">Waiting for data...</div>
    </div>

    <div class="messages-panel" id="messages-panel" style="display:none">
      <div class="empty-state">No messages</div>
    </div>

    <div class="alerts-panel" id="alerts-panel" style="display:none">
      <div class="empty-state">No alerts</div>
    </div>

    <div class="image-panel" id="image-panel" style="display:none">
      <img id="board-image" src="" alt="">
    </div>

    <div id="status-bar">
      <div><span class="status-dot" id="status-dot"></span><span id="status-text">Waiting...</span></div>
      <div id="last-update">--</div>
    </div>
  </div>

<!-- THREE.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

let showClock = true, clockTop = true, showSeconds = true, showImage = false;

// ─── THREE.js background: floating atoms ───
// Atoms react to data: important items make nearby atoms flash and spin faster
const canvas = document.getElementById('bg-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 30;

scene.add(new THREE.AmbientLight(0x00ff66, 0.25));
const pl = new THREE.PointLight(0x00ff66, 1.2, 80); pl.position.set(10, 10, 20); scene.add(pl);
const pl2 = new THREE.PointLight(0x0088ff, 0.6, 60); pl2.position.set(-15, -10, 15); scene.add(pl2);

class Atom {
  constructor(i) {
    this.index = i;
    this.baseRotSpeed = 0.003 + Math.random() * 0.006;
    this.rotS = new THREE.Vector3(
      (Math.random()-0.5) * this.baseRotSpeed,
      (Math.random()-0.5) * this.baseRotSpeed,
      (Math.random()-0.5) * this.baseRotSpeed
    );
    this.baseOrbitSpeed = 0.3 + Math.random() * 0.8;
    this.spd = this.baseOrbitSpeed;
    this.pos = new THREE.Vector3((Math.random()-0.5)*40, (Math.random()-0.5)*25, (Math.random()-0.5)*20);
    this.rad = 0.7 + Math.random() * 1.0;
    this.phase = Math.random() * Math.PI * 2;
    this.intensity = 0; // 0 = normal, 1 = fully excited

    const ng = new THREE.IcosahedronGeometry(0.35, 0);
    const nm = new THREE.MeshBasicMaterial({ color: Math.random()>0.5 ? 0x00ff66 : 0x0088ff, wireframe: true, transparent: true, opacity: 0.7 });
    this.nuc = new THREE.Mesh(ng, nm);
    this.nuc.position.copy(this.pos);
    scene.add(this.nuc);

    const eg = new THREE.SphereGeometry(0.1, 6, 6);
    const em = new THREE.MeshBasicMaterial({ color: 0xffffff });
    this.elec = new THREE.Mesh(eg, em);
    scene.add(this.elec);
  }
  setIntensity(val) { this.intensity = Math.min(1, val); }
  update(t) {
    const boost = 1 + this.intensity * 4; // up to 5x faster when excited
    this.nuc.rotation.x += this.rotS.x * boost;
    this.nuc.rotation.y += this.rotS.y * boost;
    this.nuc.material.opacity = 0.5 + this.intensity * 0.5;
    this.nuc.scale.setScalar(1 + this.intensity * 0.3);

    const a = t * this.spd * boost + this.phase;
    this.elec.position.set(
      this.pos.x + Math.cos(a) * this.rad,
      this.pos.y + Math.sin(a) * this.rad,
      this.pos.z + Math.sin(a * 0.7) * 0.3
    );
    this.elec.material.color.setHex(this.intensity > 0.5 ? 0xff4444 : 0xffffff);
  }
}

const atoms = [];
for (let i = 0; i < 20; i++) atoms.push(new Atom(i));

// Background particles
const pg = new THREE.BufferGeometry();
const pp = new Float32Array(100 * 3);
for (let i = 0; i < 100; i++) {
  pp[i*3] = (Math.random()-0.5)*60;
  pp[i*3+1] = (Math.random()-0.5)*40;
  pp[i*3+2] = (Math.random()-0.5)*30 - 10;
}
pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: 0x00ff44, size: 0.05, transparent: true, opacity: 0.25 })));

function animate(time) {
  requestAnimationFrame(animate);
  atoms.forEach(a => a.update(time * 0.001));
  renderer.render(scene, camera);
}
animate(0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Dashboard ───
const FEED_URL = "file://" + (window.HOME || "/Users/thinkyhead") + "/Library/Application%20Support/WebSavers/HermesBoard/feed.json";
const IMAGE_URL = "file://" + (window.HOME || "/Users/thinkyhead") + "/Library/Application%20Support/WebSavers/HermesBoard/image.png";

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function updateClock() {
  const d = new Date();
  const secs = showSeconds ? ':' + pad(d.getSeconds()) : '';
  document.getElementById('clock-time').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + secs;
  document.getElementById('clock-date').textContent = d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function layoutClock() {
  const p = document.getElementById('clock-panel');
  p.classList.toggle('hidden', !showClock);
  p.classList.toggle('bottom', !clockTop);
}

function renderStats(stats) {
  const el = document.getElementById('stats-panel');
  if (!stats || Object.keys(stats).length === 0) {
    el.innerHTML = '<div class="empty-state">No data</div>';
    return;
  }
  el.innerHTML = '';
  let atomIdx = 0;
  for (const [key, val] of Object.entries(stats)) {
    const row = document.createElement('div');
    row.className = 'stat-row';
    const num = parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0;

    // Alert styling for high values
    const t = key.toLowerCase();
    if ((t.includes('cpu') || t.includes('memory') || t.includes('disk') || t.includes('load')) && num > 80) {
      row.classList.add('alert-error');
      if (atoms[atomIdx % atoms.length]) atoms[atomIdx % atoms.length].setIntensity(1);
    } else if ((t.includes('cpu') || t.includes('memory') || t.includes('disk')) && num > 60) {
      row.classList.add('alert-warn');
      if (atoms[atomIdx % atoms.length]) atoms[atomIdx % atoms.length].setIntensity(0.6);
    }
    atomIdx++;

    const label = document.createElement('span');
    label.className = 'stat-label';
    label.textContent = key;
    const value = document.createElement('span');
    value.className = 'stat-value';
    value.textContent = val;
    row.appendChild(label);
    row.appendChild(value);
    el.appendChild(row);
  }
}

function renderMessages(messages) {
  const el = document.getElementById('messages-panel');
  if (!messages || messages.length === 0) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = messages.slice(-5).reverse().map(m => {
    const t = m.time || '';
    const f = escapeHtml(m.from || 'System');
    const txt = escapeHtml(m.text || m.message || '');
    return `<div class="message"><span class="from">${f}</span>${txt}<span class="time">${t}</span></div>`;
  }).join('');
}

function renderAlerts(alerts) {
  const el = document.getElementById('alerts-panel');
  if (!alerts || alerts.length === 0) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = alerts.slice(0, 4).map(a => {
    const level = a.level || 'info';
    return `<div class="alert ${level}">${escapeHtml((a.text || a.message || '').substring(0, 40))}</div>`;
  }).join('');
}

function renderImage() {
  const panel = document.getElementById('image-panel');
  const img = document.getElementById('board-image');
  if (!showImage) { panel.style.display = 'none'; return; }
  panel.style.display = 'flex';
  img.src = IMAGE_URL + '?t=' + Date.now();
  img.onerror = () => {
    panel.innerHTML = '<div class="image-placeholder">No image</div>';
  };
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function checkFeed() {
  try {
    const resp = await fetch(FEED_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.stats) renderStats(data.stats);
    if (data.messages) renderMessages(data.messages);
    if (data.alerts) renderAlerts(data.alerts);
    document.getElementById('status-dot').classList.remove('status-offline');
    document.getElementById('status-text').textContent = 'Connected';
    document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('status-dot').classList.add('status-offline');
    document.getElementById('status-text').textContent = 'Offline';
  }
}

// HermesBoard: receive live system stats from ObjC
window.applySystemStats = function(stats) {
  const statsPanel = document.getElementById('stats-panel');
  // Build or update stat rows for live system data
  const liveStats = {
    'CPU': stats.cpu.toFixed(1) + '%',
    'Memory': (stats.memory / (1024*1024*1024)).toFixed(1) + ' GB',
    'Temperature': stats.temperature.toFixed(0) + '°C'
  };
  // Preserve any non-system stats from feed, override system ones
  renderStats(liveStats);
};

window.applySettings = function(s) {
  if (s.clock !== undefined) showClock = s.clock;
  if (s.clockPosition !== undefined) clockTop = !s.clockPosition;
  if (s.seconds !== undefined) showSeconds = s.seconds;
  if (s.image !== undefined) showImage = s.image;
  layoutClock();
  updateClock();
  renderImage();
};

layoutClock();
updateClock();
setInterval(updateClock, 1000);
setInterval(checkFeed, 3000);
checkFeed();
renderImage();
</script>
</body>
</html>
