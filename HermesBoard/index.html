<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HermesBoard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { overflow: hidden; background: #030307; font-family: 'SF Mono', 'Menlo', monospace; color: #b0b0b0; }

  #bg-canvas { position: fixed; inset: 0; z-index: 0; opacity: 0.4; }
  .bg-grid {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,255,100,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,100,0.012) 1px, transparent 1px);
    background-size: 80px 80px;
  }

  #dashboard {
    position: relative; z-index: 2;
    width: 100%; height: 100vh;
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }

  /* Clock */
  .clock-panel { text-align: center; padding: 6px; }
  .clock-time {
    font-size: 32px; font-weight: 200; letter-spacing: 2px; color: #fff;
    text-shadow: 0 0 15px rgba(0,255,100,0.2); font-variant-numeric: tabular-nums;
  }
  .clock-date { font-size: 10px; color: rgba(0,255,100,0.3); letter-spacing: 2px; }
  .clock-panel.bottom .clock-time { font-size: 20px; }
  .clock-panel.bottom .clock-date { font-size: 8px; }
  .clock-panel.hidden { display: none; }

  /* Stats mosaic */
  .stats-grid {
    flex: 1; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    grid-auto-rows: minmax(80px, 1fr);
    gap: 8px; overflow-y: auto; padding-right: 4px;
  }
  .stats-grid::-webkit-scrollbar { width: 3px; }
  .stats-grid::-webkit-scrollbar-thumb { background: rgba(0,255,100,0.15); border-radius: 2px; }

  .stat-card {
    background: rgba(8, 12, 10, 0.55);
    border: 1px solid rgba(0,255,100,0.06);
    border-radius: 8px;
    padding: 10px;
    display: flex; flex-direction: column; gap: 4px;
    position: relative; overflow: hidden;
  }
  .stat-card.wide { grid-column: span 2; }
  .stat-card.tall { grid-row: span 2; }

  .stat-header {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .stat-title {
    font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
    color: rgba(0,255,100,0.4);
  }
  .stat-value {
    font-size: 14px; color: #0f0; font-weight: 600;
    font-variant-numeric: tabular-nums; text-align: right;
    text-shadow: 0 0 8px rgba(0,255,100,0.3);
  }
  .stat-viz {
    flex: 1; position: relative; min-height: 30px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Viz types */
  .viz-particles { position: absolute; inset: 0; overflow: hidden; }
  .viz-particles .dot {
    position: absolute; width: 3px; height: 3px;
    background: #0f0; border-radius: 50%; box-shadow: 0 0 3px #0f0;
  }

  .viz-meter svg { width: 100%; height: 100%; }

  .viz-bar { width: 100%; padding: 0 4px; display: flex; align-items: center; }
  .viz-bar-fill {
    height: 4px; background: linear-gradient(90deg, #0f0, #0f8);
    border-radius: 2px; box-shadow: 0 0 4px rgba(0,255,100,0.4);
  }

  .viz-wave svg { width: 100%; height: 100%; }

  .viz-gauge { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .viz-gauge svg { max-width: 100%; max-height: 100%; }

  .viz-spark { width: 100%; height: 100%; }
  .viz-spark svg { width: 100%; height: 100%; }

  /* Image panel */
  .image-card {
    grid-column: span 2; grid-row: span 2;
    background: rgba(8, 12, 10, 0.55);
    border: 1px solid rgba(0,255,100,0.06);
    border-radius: 8px; padding: 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .image-card .stat-header {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .image-card .stat-title {
    font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
    color: rgba(0,255,100,0.4);
  }
  .image-card img {
    flex: 1; object-fit: contain; border-radius: 4px;
    min-height: 0;
  }
  .image-card .image-placeholder {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.15); font-size: 10px;
  }
  .alerts-panel {
    max-height: 60px; overflow-y: auto;
    display: flex; gap: 4px; flex-wrap: wrap;
    padding: 4px 6px;
    background: rgba(8, 12, 10, 0.4);
    border: 1px solid rgba(0,255,100,0.06);
    border-radius: 6px;
  }
  .alert {
    font-size: 9px; padding: 2px 6px; border-radius: 3px;
    border-left: 2px solid; white-space: nowrap;
  }
  .alert.info { border-color: #3b82f6; background: rgba(59,130,246,0.06); }
  .alert.warn { border-color: #f59e0b; background: rgba(245,158,11,0.06); }
  .alert.error { border-color: #ef4444; background: rgba(239,68,68,0.06); }
  .alert.success { border-color: #10b981; background: rgba(16,185,129,0.06); }

  /* Status */
  #status-bar {
    display: flex; justify-content: space-between;
    padding: 3px 6px; font-size: 8px; color: rgba(255,255,255,0.2);
    border-top: 1px solid rgba(0,255,100,0.04);
  }
  .status-dot {
    display: inline-block; width: 3px; height: 3px; border-radius: 50%;
    background: #0f0; box-shadow: 0 0 2px #0f0; margin-right: 3px; vertical-align: middle;
  }
  .status-offline { background: #f00; }

  .empty-state { color: rgba(255,255,255,0.15); font-size: 10px; text-align: center; padding: 30px; }
</style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-grid"></div>

  <div id="dashboard">
    <div class="clock-panel" id="clock-panel">
      <div class="clock-time" id="clock-time">--:--:--</div>
      <div class="clock-date" id="clock-date">Loading...</div>
    </div>

    <div class="stats-grid" id="stats-panel">
      <div class="empty-state">Waiting for data...</div>
    </div>

    <div class="alerts-panel" id="alerts-panel" style="display:none"></div>

    <div id="status-bar">
      <div><span class="status-dot" id="status-dot"></span><span id="status-text">Waiting...</span></div>
      <div id="last-update">--</div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

let showClock = true, clockTop = true, showSeconds = true, showImage = false;

// ─── THREE.js background ───
const canvas = document.getElementById('bg-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 30;

scene.add(new THREE.AmbientLight(0x00ff66, 0.25));
const pl = new THREE.PointLight(0x00ff66, 1.2, 80); pl.position.set(10, 10, 20); scene.add(pl);
const pl2 = new THREE.PointLight(0x0088ff, 0.6, 60); pl2.position.set(-15, -10, 15); scene.add(pl2);

class Atom {
  constructor() {
    this.pos = new THREE.Vector3((Math.random()-0.5)*40, (Math.random()-0.5)*25, (Math.random()-0.5)*20);
    this.rotS = new THREE.Vector3((Math.random()-0.5)*0.008, (Math.random()-0.5)*0.008, (Math.random()-0.5)*0.008);
    this.spd = 0.4 + Math.random() * 1.2;
    this.rad = 0.7 + Math.random() * 1.0;
    this.phase = Math.random() * Math.PI * 2;
    const ng = new THREE.IcosahedronGeometry(0.35, 0);
    const nm = new THREE.MeshBasicMaterial({ color: Math.random()>0.5 ? 0x00ff66 : 0x0088ff, wireframe: true, transparent: true, opacity: 0.7 });
    this.nuc = new THREE.Mesh(ng, nm);
    this.nuc.position.copy(this.pos);
    scene.add(this.nuc);
    const eg = new THREE.SphereGeometry(0.1, 6, 6);
    const em = new THREE.MeshBasicMaterial({ color: 0xffffff });
    this.elec = new THREE.Mesh(eg, em);
    scene.add(this.elec);
  }
  update(t) {
    this.nuc.rotation.x += this.rotS.x;
    this.nuc.rotation.y += this.rotS.y;
    const a = t * this.spd + this.phase;
    this.elec.position.set(
      this.pos.x + Math.cos(a) * this.rad,
      this.pos.y + Math.sin(a) * this.rad,
      this.pos.z + Math.sin(a * 0.7) * 0.3
    );
  }
}

const atoms = [];
for (let i = 0; i < 18; i++) atoms.push(new Atom());

const pg = new THREE.BufferGeometry();
const pp = new Float32Array(120 * 3);
for (let i = 0; i < 120; i++) {
  pp[i*3] = (Math.random()-0.5)*60;
  pp[i*3+1] = (Math.random()-0.5)*40;
  pp[i*3+2] = (Math.random()-0.5)*30 - 10;
}
pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: 0x00ff44, size: 0.05, transparent: true, opacity: 0.25 })));

function animate(time) {
  requestAnimationFrame(animate);
  atoms.forEach(a => a.update(time * 0.001));
  renderer.render(scene, camera);
}
animate(0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Dashboard ───
const FEED_URL = "file://" + (window.HOME || "/Users/thinkyhead") + "/Library/Application%20Support/WebSavers/HermesBoard/feed.json";
const IMAGE_URL = "file://" + (window.HOME || "/Users/thinkyhead") + "/Library/Application%20Support/WebSavers/HermesBoard/image.png";

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function updateClock() {
  const d = new Date();
  const secs = showSeconds ? ':' + pad(d.getSeconds()) : '';
  document.getElementById('clock-time').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + secs;
  document.getElementById('clock-date').textContent = d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function layoutClock() {
  const p = document.getElementById('clock-panel');
  p.classList.toggle('hidden', !showClock);
  p.classList.toggle('bottom', !clockTop);
}

// ─── Viz factories ───

function vizParticles(count) {
  const box = document.createElement('div');
  box.className = 'viz-particles';
  count = Math.max(1, Math.min(60, Math.floor(count)));
  for (let i = 0; i < count; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.left = (Math.random() * 92 + 4) + '%';
    dot.style.top = (Math.random() * 70 + 15) + '%';
    dot.style.opacity = 0.5 + Math.random() * 0.5;
    dot.dataset.vx = (Math.random() - 0.5) * 0.6;
    dot.dataset.vy = (Math.random() - 0.5) * 0.6;
    box.appendChild(dot);
  }
  return box;
}

function vizMeter(pct) {
  const wrap = document.createElement('div');
  wrap.className = 'viz-meter';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 100 28');
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  bg.setAttribute('d', 'M 5 22 A 18 18 0 0 1 95 22');
  bg.setAttribute('fill', 'none'); bg.setAttribute('stroke', 'rgba(0,255,100,0.12)'); bg.setAttribute('stroke-width', '2.5');
  svg.appendChild(bg);
  const angle = Math.PI * (1 - pct / 100);
  const x = 50 + 18 * Math.cos(angle), y = 22 - 18 * Math.sin(angle);
  const val = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  val.setAttribute('d', `M 5 22 A 18 18 0 ${pct > 50 ? 1 : 0} 1 ${x.toFixed(1)} ${y.toFixed(1)}`);
  val.setAttribute('fill', 'none'); val.setAttribute('stroke', '#0f0'); val.setAttribute('stroke-width', '2.5');
  val.setAttribute('stroke-linecap', 'round');
  svg.appendChild(val);
  constneedle = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  const nx = 50 + 14 * Math.cos(angle), ny = 22 - 14 * Math.sin(angle);
  needle.setAttribute('x1', '50'); needle.setAttribute('y1', '22');
  needle.setAttribute('x2', nx.toFixed(1)); needle.setAttribute('y2', ny.toFixed(1));
  needle.setAttribute('stroke', '#fff'); needle.setAttribute('stroke-width', '1.2');
  svg.appendChild(needle);
  wrap.appendChild(svg);
  return wrap;
}

function vizBar(val, max) {
  const wrap = document.createElement('div');
  wrap.className = 'viz-bar';
  const fill = document.createElement('div');
  fill.className = 'viz-bar-fill';
  fill.style.width = Math.min(100, (val / max) * 100) + '%';
  wrap.appendChild(fill);
  return wrap;
}

function vizWave(amp) {
  const wrap = document.createElement('div');
  wrap.className = 'viz-wave';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 100 28'); svg.setAttribute('preserveAspectRatio', 'none');
  let d = 'M 0 14';
  for (let x = 0; x <= 100; x += 2) {
    d += ` L ${x} ${(14 + Math.sin(x * 0.25 + amp) * amp * 6).toFixed(1)}`;
  }
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d); path.setAttribute('fill', 'none');
  path.setAttribute('stroke', '#0f0'); path.setAttribute('stroke-width', '1.2');
  svg.appendChild(path);
  wrap.appendChild(svg);
  return wrap;
}

function vizSpark(values) {
  const wrap = document.createElement('div');
  wrap.className = 'viz-spark';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 100 28'); svg.setAttribute('preserveAspectRatio', 'none');
  if (values.length < 2) { values = [0, 0]; }
  const max = Math.max(...values, 1);
  let d = '';
  values.forEach((v, i) => {
    const x = (i / (values.length - 1)) * 100;
    const y = 26 - (v / max) * 22;
    d += (i === 0 ? 'M' : ' L') + ` ${x.toFixed(1)} ${y.toFixed(1)}`;
  });
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  line.setAttribute('d', d); line.setAttribute('fill', 'none');
  line.setAttribute('stroke', '#0f0'); line.setAttribute('stroke-width', '1');
  svg.appendChild(line);
  // fill under curve
  const fill = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  fill.setAttribute('d', d + ' L 100 28 L 0 28 Z');
  fill.setAttribute('fill', 'rgba(0,255,100,0.1)');
  svg.insertBefore(fill, line);
  wrap.appendChild(svg);
  return wrap;
}

function animateParticles() {
  document.querySelectorAll('.viz-particles').forEach(box => {
    const w = box.clientWidth || 180, h = box.clientHeight || 50;
    for (const dot of box.children) {
      let x = parseFloat(dot.style.left) / 100 * w;
      let y = parseFloat(dot.style.top) / 100 * h;
      let vx = parseFloat(dot.dataset.vx), vy = parseFloat(dot.dataset.vy);
      x += vx; y += vy;
      if (x < 1 || x > w-1) { vx = -vx; x = Math.max(1, Math.min(w-1, x)); }
      if (y < 1 || y > h-1) { vy = -vy; y = Math.max(1, Math.min(h-1, y)); }
      dot.style.left = (x / w * 100) + '%';
      dot.style.top = (y / h * 100) + '%';
      dot.dataset.vx = vx; dot.dataset.vy = vy;
    }
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// Auto-pick viz based on value characteristics
function makeViz(title, value) {
  const t = title.toLowerCase();
  const num = parseFloat(String(value).replace(/[^0-9.-]/g, '')) || 0;

  // Percentage → meter
  if (t.includes('%') || t.includes('usage') || t.includes('cpu') || t.includes('memory') || t.includes('disk') || t.includes('battery') || t.includes('load')) {
    return vizMeter(Math.min(100, num));
  }
  // Integer count < 100 → particles
  if (Number.isInteger(num) && num > 0 && num <= 80) {
    return vizParticles(num);
  }
  // Large number → bar
  if (num >= 100) {
    return vizBar(num, num * 1.5);
  }
  // Decimal or small → waveform
  return vizWave(num);
}

function renderStats(stats) {
  const el = document.getElementById('stats-panel');
  if (!stats || Object.keys(stats).length === 0) {
    if (!showImage) { el.innerHTML = '<div class="empty-state">No data</div>'; }
    return;
  }
  el.innerHTML = '';
  for (const [key, val] of Object.entries(stats)) {
    const card = document.createElement('div');
    card.className = 'stat-card';

    const header = document.createElement('div');
    header.className = 'stat-header';
    const title = document.createElement('div');
    title.className = 'stat-title';
    title.textContent = key;
    const value = document.createElement('div');
    value.className = 'stat-value';
    value.textContent = val;
    header.appendChild(title);
    header.appendChild(value);
    card.appendChild(header);

    const viz = document.createElement('div');
    viz.className = 'stat-viz';
    viz.appendChild(makeViz(key, val));
    card.appendChild(viz);

    el.appendChild(card);
  }
}

function renderImage() {
  let card = document.getElementById('image-card');
  if (!showImage) { if (card) card.remove(); return; }
  if (!card) {
    card = document.createElement('div');
    card.id = 'image-card';
    card.className = 'image-card';
    const header = document.createElement('div');
    header.className = 'stat-header';
    const title = document.createElement('div');
    title.className = 'stat-title';
    title.textContent = 'Display';
    header.appendChild(title);
    card.appendChild(header);
    const img = document.createElement('img');
    img.id = 'board-image';
    card.appendChild(img);
    document.getElementById('stats-panel').appendChild(card);
  }
  const img = document.getElementById('board-image');
  img.src = IMAGE_URL + '?t=' + Date.now();
  img.onerror = () => {
    card.innerHTML = '<div class="image-placeholder">No image</div>';
  };
}

function renderAlerts(alerts) {
  const el = document.getElementById('alerts-panel');
  if (!alerts || alerts.length === 0) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = alerts.slice(0, 5).map(a => {
    const level = a.level || 'info';
    return `<div class="alert ${level}">${escapeHtml((a.text || a.message || '').substring(0, 40))}</div>`;
  }).join('');
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function checkFeed() {
  try {
    const resp = await fetch(FEED_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.stats) renderStats(data.stats);
    if (data.alerts) renderAlerts(data.alerts);
    document.getElementById('status-dot').classList.remove('status-offline');
    document.getElementById('status-text').textContent = 'Connected';
    document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('status-dot').classList.add('status-offline');
    document.getElementById('status-text').textContent = 'Offline';
  }
}

window.applySettings = function(s) {
  if (s.clock !== undefined) showClock = s.clock;
  if (s.clockPosition !== undefined) clockTop = !s.clockPosition;
  if (s.seconds !== undefined) showSeconds = s.seconds;
  if (s.image !== undefined) showImage = s.image;
  layoutClock();
  updateClock();
  renderImage();
};

layoutClock();
updateClock();
setInterval(updateClock, 1000);
setInterval(checkFeed, 3000);
checkFeed();
</script>
</body>
</html>
